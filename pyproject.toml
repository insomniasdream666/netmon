[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["netmon", "netmon.*"]
exclude = ["docker", "docker.*", "tests", "tests.*"]

[project]
name = "netmon"
version = "0.1.0"
description = "Network monitor & diagnostic assistant for Kali Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NetMon Contributors" }]
keywords = ["network", "monitoring", "kali", "diagnostics", "tui", "ollama"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "influxdb-client>=1.38",
    "psutil>=5.9",
    "netifaces>=0.11",
    "python-nmap>=0.7",
    "dnspython>=2.4",
    "textual>=0.52",
    "textual-plotext>=0.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "ollama>=0.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
netmon = "netmon.__main__:run"

[project.urls]
Homepage = "https://github.com/insomniasdream666/netmon"
Documentation = "https://github.com/insomniasdream666/netmon/docs"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "docker"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines are tolerated for tables / prompt templates
    "B008",   # typer depends on function calls in defaults
    "RUF001", # emoji-free but unicode symbols (bullet/arrows) appear in UI strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N806", "N803"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["(^|/)tests/", "(^|/)docker/"]

[[tool.mypy.overrides]]
module = ["netmon.tui.*", "netmon.web.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
