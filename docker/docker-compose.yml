# NetMon stack: the monitor (web interface) plus InfluxDB for time-series
# metrics. Ollama is expected on the host, reachable through
# host.docker.internal, because models are large and benefit from host GPU/CPU.
#
# Usage:
#   export INFLUX_TOKEN=$(openssl rand -hex 24)
#   export INFLUXDB_PASSWORD=$(openssl rand -hex 16)
#   export NETMON_WEB_PASSWORD=$(openssl rand -hex 16)
#   echo "NetMon login: ${NETMON_WEB_USERNAME:-admin} / $NETMON_WEB_PASSWORD"
#   docker compose -f docker/docker-compose.yml up -d
#
# Then open http://localhost:8080 and use the credentials above.

services:
  influxdb:
    image: influxdb:2.7
    container_name: netmon-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?set INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-netmon}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  netmon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: netmon:local
    container_name: netmon
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      NETMON_ENV: production
      NETMON_WEB_HOST: 0.0.0.0
      NETMON_WEB_PORT: "8080"
      NETMON_WEB_AUTH: "true"
      NETMON_WEB_USERNAME: ${NETMON_WEB_USERNAME:-admin}
      # Required by the app when web.auth is enabled; empty values fail closed.
      NETMON_WEB_PASSWORD: ${NETMON_WEB_PASSWORD:-}
      NETMON_SQLITE_PATH: /data/config.db
      NETMON_CONFIG_PATH: /data/config.yaml
      INFLUXDB_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-netmon}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      # Ollama runs on the host by default; override for a remote instance.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      NETMON_ALERTS_ENABLED: ${NETMON_ALERTS_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - netmon_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Network visibility options. The default bridge gives NetMon its own
    # interfaces only; use host networking when monitoring the host's own
    # network stack, or add NET_RAW/NET_ADMIN for SYN scans.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8080/api/health', timeout=5).status_code < 400 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Optional: run nmap-heavy scans and diagnostics on the host network stack.
  # docker compose -f docker/docker-compose.yml --profile host-net up -d netmon-host
  netmon-host:
    profiles: ["host-net"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: netmon:local
    container_name: netmon-host
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      NETMON_ENV: production
      NETMON_WEB_PORT: "8080"
      NETMON_WEB_AUTH: "true"
      NETMON_WEB_USERNAME: ${NETMON_WEB_USERNAME:-admin}
      # Required by the app when web.auth is enabled; empty values fail closed.
      NETMON_WEB_PASSWORD: ${NETMON_WEB_PASSWORD:-}
      NETMON_SQLITE_PATH: /data/config.db
      INFLUXDB_URL: http://127.0.0.1:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
    volumes:
      - netmon_data:/data

volumes:
  influxdb_data:
  influxdb_config:
  netmon_data:
